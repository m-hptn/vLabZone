# Stage 1b – RouterOS trial, hybrid variant (see docs/routeros-spike.md): same wiring as the VRF trial,
# but one wg0 in main and routing rules into the setup VRFs. Separate lab so that the CHR starts clean.
#
# Small, hand-written lab to check the riskiest assumptions before a RouterOS edge is built
# for real: WireGuard inside a VRF on RouterOS, overlapping setup networks, MASQUERADE,
# containerlab interface mapping, boot time, REST API for peer management.
#
#   ws (10.20.10.11) ── ether2 [CHR lab edge] ether3 ══ trunk 112,107 ══ sw ─┬─ dev12  192.168.1.20  VLAN 112 (setup 12)
#                       10.20.10.1                                         └─ dev7   192.168.1.20  VLAN 107 (setup 7)
#
# Run with:  make spike-up SPIKE=hybrid / spike-down SPIKE=hybrid   (needs /dev/kvm and the image from `make build-routeros`)
name: vlab-ros-hybrid

mgmt:
  network: vlab-mgmt
  ipv4-subnet: ${VLAB_MGMT_SUBNET:=172.31.254.0/24}
  ipv6-subnet: ${VLAB_MGMT_SUBNET6:=3fff:172:31:254::/64}

topology:
  defaults:
    kind: linux

  nodes:
    chr:
      kind: mikrotik_ros
      image: vrnetlab/mikrotik_routeros:${ROUTEROS_VERSION:=7.24.6}
      # vrnetlab needs its management interface (ether1); RouterOS is reached over it with REST/SSH.
      # All other nodes have no management interface (network-mode: none), as in the main labs.

    ws:
      image: hwpool/workspace:latest
      network-mode: none
      env: { WS_IP: 10.20.10.11/24, WS_MODE: desktop }

    sw:
      image: hwpool/base:latest
      network-mode: none
      exec:
        - ip link add br0 type bridge vlan_filtering 1 vlan_default_pvid 0
        - ip link set br0 up
        - ip link set eth1 master br0 up
        - bridge vlan add dev eth1 vid 112
        - bridge vlan add dev eth1 vid 107
        - ip link set eth2 master br0 up
        - bridge vlan add dev eth2 vid 112 pvid untagged
        - ip link set eth3 master br0 up
        - bridge vlan add dev eth3 vid 107 pvid untagged

    dev12:
      image: hwpool/device:latest
      network-mode: none
      env: { NAME: dev12, SWITCH: spike, IP: 192.168.1.20/24, GW: 192.168.1.1 }
    dev7:
      image: hwpool/device:latest
      network-mode: none
      env: { NAME: dev7, SWITCH: spike, IP: 192.168.1.20/24, GW: 192.168.1.1 }

  links:
    - endpoints: ["ws:eth1", "chr:eth1"]      # clab eth1 = RouterOS ether2 (ether1 is management)
    - endpoints: ["chr:eth2", "sw:eth1"]      # trunk: RouterOS ether3
    - endpoints: ["sw:eth2", "dev12:eth1"]
    - endpoints: ["sw:eth3", "dev7:eth1"]
