- name: Install base packages
  become: true
  ansible.builtin.apt:
    name: [ca-certificates, curl, git, rsync, make, unzip, jq, kmod, iproute2, python3-venv, python3-pip]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Load kernel modules now
  become: true
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ vlab_kernel_modules }}"

- name: Load kernel modules on boot
  become: true
  ansible.builtin.copy:
    dest: /etc/modules-load.d/vlabzone.conf
    content: "{{ vlab_kernel_modules | join('\n') }}\n"
    mode: "0644"

- name: Install Docker CE if missing
  ansible.builtin.include_tasks: docker.yml
  when: vlab_manage_docker | bool

- name: Allow {{ vlab_user }} to use docker without sudo
  become: true
  ansible.builtin.user:
    name: "{{ vlab_user }}"
    groups: docker
    append: true
  when: vlab_user != 'root'

- name: Install containerlab
  ansible.builtin.include_tasks: containerlab.yml

- name: Allow {{ vlab_user }} to run containerlab without sudo (setuid binary, group clab_admins)
  become: true
  ansible.builtin.user:
    name: "{{ vlab_user }}"
    groups: clab_admins
    append: true
  when: vlab_user != 'root'
