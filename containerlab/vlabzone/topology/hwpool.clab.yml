# vLabZone base topology (idea.md §4). Addresses: idea.md §4.3, setups: config/setups.yaml.
#
#   ws-std ─┐
#   ws-power┼─ corp-fw ─ UDP 51800-52099 ─ lab-edge ─ trunk ─ lab-sw ─┬─ dev-12-20 / dev-12-21  (VLAN 112)
#   ws-ci  ─┘    │  └─ TCP 443/8443 ─ broker  │                      └─ dev-7-20  / dev-7-21   (VLAN 107)
#   corp-svc ────┘                      └─── lab-mgmt (10.198.0.0/24) ───┘
#
# No node has a Docker management interface (network-mode: none): every path
# goes through the links below, so nothing bypasses the corporate firewall.
name: hwpool

mgmt:
  network: vlab-mgmt
  ipv4-subnet: ${VLAB_MGMT_SUBNET:=172.31.254.0/24}
  ipv6-subnet: ${VLAB_MGMT_SUBNET6:=3fff:172:31:254::/64}

topology:
  defaults:
    kind: linux
    network-mode: none
    binds:
      - ../config:/etc/vlab:ro

  nodes:
    # --- corporate (simulated) -------------------------------------------------
    corp-fw:
      image: hwpool/router:latest
      env: { ROLE: corp-fw }
    corp-svc:
      image: hwpool/device:latest
      env: { NAME: corp-svc, SETUP: corp, IP: 10.20.20.10/24, GW: 10.20.20.1 }
    ws-std:
      image: hwpool/workspace:latest
      env: { WS_IP: 10.20.10.11/24, WS_MODE: desktop }
    ws-power:
      image: hwpool/workspace:latest
      env: { WS_IP: 10.20.10.12/24, WS_MODE: power }
    ws-ci:
      image: hwpool/workspace:latest
      env: { WS_IP: 10.20.10.13/24, WS_MODE: alias }

    # --- lab zone ------------------------------------------------------------------
    lab-edge:
      image: hwpool/edge:latest
      env: { EDGE_MODE: "${EDGE_MODE:=vrf}" }
    broker:
      image: hwpool/broker:latest
      env: { EDGE_IMPL: "${EDGE_IMPL:=linux}" }
    lab-sw:
      image: hwpool/router:latest
      env: { ROLE: switch }
    lab-mgmt:
      image: hwpool/mgmt:latest
      env: { PORTS: "eth1 eth2 eth3" }

    # --- setup 12 (VLAN 112) and setup 7 (VLAN 107), both 192.168.1.0/24 ------------
    # GW 192.168.1.1 does not exist on purpose (E04)
    dev-12-20:
      image: hwpool/device:latest
      env: { NAME: dev-12-20, SETUP: "12", IP: 192.168.1.20/24, GW: 192.168.1.1 }
    dev-12-21:
      image: hwpool/device:latest
      env: { NAME: dev-12-21, SETUP: "12", IP: 192.168.1.21/24, GW: 192.168.1.1 }
    dev-7-20:
      image: hwpool/device:latest
      env: { NAME: dev-7-20, SETUP: "7", IP: 192.168.1.20/24, GW: 192.168.1.1 }
    dev-7-21:
      image: hwpool/device:latest
      env: { NAME: dev-7-21, SETUP: "7", IP: 192.168.1.21/24, GW: 192.168.1.1 }

  links:
    # corporate
    - endpoints: ["ws-std:eth1", "corp-fw:eth1"]
    - endpoints: ["ws-power:eth1", "corp-fw:eth2"]
    - endpoints: ["ws-ci:eth1", "corp-fw:eth3"]
    - endpoints: ["corp-svc:eth1", "corp-fw:eth4"]
    # the one-time allowance: corporate -> lab
    - endpoints: ["corp-fw:eth10", "lab-edge:eth1"]
    - endpoints: ["corp-fw:eth11", "broker:eth1"]
    # lab management
    - endpoints: ["lab-edge:eth3", "lab-mgmt:eth1"]
    - endpoints: ["broker:eth2", "lab-mgmt:eth2"]
    - endpoints: ["lab-sw:eth2", "lab-mgmt:eth3"]
    # trunk edge <-> switch
    - endpoints: ["lab-edge:eth2", "lab-sw:eth1"]
    # device access ports (ports and VLANs: config/setups.yaml)
    - endpoints: ["dev-12-20:eth1", "lab-sw:eth11"]
    - endpoints: ["dev-12-21:eth1", "lab-sw:eth12"]
    - endpoints: ["dev-7-20:eth1", "lab-sw:eth21"]
    - endpoints: ["dev-7-21:eth1", "lab-sw:eth22"]
