- name: Check for an existing docker installation
  ansible.builtin.command: docker --version
  register: vlab_docker_present
  changed_when: false
  failed_when: false

- name: Install Docker CE from the official repository
  when: vlab_docker_present.rc != 0
  become: true
  block:
    - name: Add the Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
        suites: ["{{ ansible_facts.distribution_release }}"]
        components: [stable]
        architectures: ["{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"]
        signed_by: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - "docker-ce{{ '=' ~ vlab_docker_ce_version if vlab_docker_ce_version else '' }}"
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
        update_cache: true

- name: Make sure docker is running
  become: true
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
