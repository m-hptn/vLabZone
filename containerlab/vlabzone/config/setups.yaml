# Single source of truth for the lab: edge parameters, the switch/device INVENTORY
# (fixed hardware) and the initial GROUPING of devices into setups (later owned by the broker).
# Read by topology/gen.py, the edge, the switches, the PBR gateways and the tests (vlab-cfg).
#
# Real world (device_arc.drawio): MikroTik + Proxmox on an aggregation switch, which connects
# the system switches. A setup = a dynamic group of devices on ONE system switch.

edge:
  tunnel_net: 10.250.0.0/16
  tunnel_ip: 10.250.0.1
  wg_port_base: 51800          # VRF mode: setup N listens on wg_port_base + N
  wg_port_pbr: 51820           # PBR mode: single wg0
  transfer:                    # PBR mode only: edge <-> setup gateways gw-N
    vlan: 199
    net: 10.199.0.0/24         # edge .1, gw-N .N
    edge_ip: 10.199.0.1
  alias_net: 10.200.0.0/16     # setup N -> 10.200.N.0/24

# ---------------------------------------------------------------------------------------
# Shared access appliances (docs/consoles-usb.md): one serial device server and one USB hub
# serve the devices of ALL setups. Own VLAN on the aggregation switch, reached only through
# the edge (no NAT: the appliances see the tunnel address 10.250.<setup>.<user>).
# ---------------------------------------------------------------------------------------
appliances:
  vlan: 197
  net: 10.197.0.0/24
  edge_ip: 10.197.0.1
  serial:                      # Moxa NPort 5600 (8 ports), operation mode RFC 2217
    - { name: nport1, ip: 10.197.0.10, agg_port: eth31, mode: rfc2217, base_port: 4000, ports: 8 }
  usb:                         # Digi AnywhereUSB 24 Plus: one TCP port for all hub ports
    - { name: ausb1, ip: 10.197.0.11, agg_port: eth32, tcp_port: 18574, ports: 24 }

# ---------------------------------------------------------------------------------------
# Inventory: switches and devices (fixed hardware, cabling)
# ---------------------------------------------------------------------------------------
aggregation:
  name: agg                    # node lab-agg
  edge_port: eth1              # trunk to lab-edge
  mgmt_ip: 10.198.0.3/24

switches:                      # system switches, node lab-<name>
  - name: sys1
    agg_port: eth11            # port on lab-agg; the system switch uses eth1 as uplink
    mgmt_ip: 10.198.0.4/24
    devices:                   # same IPs on one switch on purpose (identical boards)
      - { name: sys1-dev1, port: eth11, ip: 192.168.1.20/24, serial: { server: nport1, port: 1 }, usb: { hub: ausb1, port: 1 } }
      - { name: sys1-dev2, port: eth12, ip: 192.168.1.21/24, serial: { server: nport1, port: 2 } }
      - { name: sys1-dev3, port: eth13, ip: 192.168.1.20/24, serial: { server: nport1, port: 3 }, usb: { hub: ausb1, port: 2 } }
      - { name: sys1-dev4, port: eth14, ip: 192.168.1.22/24, serial: { server: nport1, port: 4 } }
  - name: sys2
    agg_port: eth12
    mgmt_ip: 10.198.0.5/24
    devices:
      - { name: sys2-dev1, port: eth11, ip: 192.168.1.20/24, serial: { server: nport1, port: 5 }, usb: { hub: ausb1, port: 3 } }
      - { name: sys2-dev2, port: eth12, ip: 192.168.1.21/24, serial: { server: nport1, port: 6 } }
      - { name: sys2-dev3, port: eth13, ip: 192.168.1.22/24, serial: { server: nport1, port: 7 } }
      - { name: sys2-dev4, port: eth14, ip: 192.168.1.20/24, serial: { server: nport1, port: 8 } }

# Wrong on purpose: devices point to a non-existent gateway (E04)
device_default_gateway: 192.168.1.1

# ---------------------------------------------------------------------------------------
# Initial grouping: which devices form which setup (one system switch per setup).
# Devices in no setup get an access port without any VLAN (cut off).
# ---------------------------------------------------------------------------------------
setups:
  - id: 12
    vlan: 112
    switch: sys1
    net: 192.168.1.0/24
    gateway: 192.168.1.254     # edge (VRF mode) or gw-12 (PBR mode)
    devices: [sys1-dev1, sys1-dev2]
    pbr_gateway_port: eth21    # PBR: port on lab-agg for gw-12 (trunk: 199 + setup VLAN)
  - id: 7
    vlan: 107
    switch: sys1               # second setup on the same switch, same IPs
    net: 192.168.1.0/24
    gateway: 192.168.1.254
    devices: [sys1-dev3, sys1-dev4]
    pbr_gateway_port: eth22
  - id: 5
    vlan: 105
    switch: sys2
    net: 192.168.1.0/24
    gateway: 192.168.1.254
    devices: [sys2-dev1, sys2-dev2]
    pbr_gateway_port: eth23
